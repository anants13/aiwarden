[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aiwarden"
dynamic = ["version"]
description = "A local watchdog for open-source AI models: alerts on cross-border egress, data leaks, and dangerous tool calls."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "aiwarden contributors" }]
keywords = ["llm", "security", "ollama", "vllm", "egress", "monitoring", "ai-safety", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# Keep this list short: every dependency is attack surface for a security tool.
dependencies = [
  "psutil>=5.9",
  "maxminddb>=2.4",
  "aiohttp>=3.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aiwarden = "aiwarden.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/aiwarden"
Issues = "https://github.com/OWNER/aiwarden/issues"

[tool.hatch.version]
path = "src/aiwarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PLE"]
# Broad excepts are deliberate: the monitor must fail open and never crash the user's workflow.
ignore = ["BLE001", "E501"]
